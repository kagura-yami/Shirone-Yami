name: blog-workspace
x-app: &app
  image: blog-authoring:1
  restart: unless-stopped
  user: "1002:1003"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 320m
  pids_limit: 64
  environment:
    NODE_ENV: production
    NODE_OPTIONS: --max-old-space-size=128
  tmpfs: ["/tmp:uid=1002,gid=1003,mode=0700,size=8m"]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  admin:
    <<: *app
    ports: ["127.0.0.1:18434:8080"]
    volumes:
      - /etc/blog/admin/config.json:/run/secrets/config.json:ro
      - /srv/blog/data/admin:/data
      - /srv/blog/queue:/queue
      - /srv/blog/results:/results:ro
      - /srv/blog/project/src/content:/legacy:ro
      - /srv/blog/project/public:/source-public:ro
    networks: [admin]
  vault:
    <<: *app
    ports: ["127.0.0.1:18435:8080"]
    volumes:
      - /etc/blog/vault/config.json:/run/secrets/config.json:ro
      - /etc/blog/vault/data-key:/run/secrets/vault-key:ro
      - /srv/blog/data/vault:/data
    networks: [vault]
networks:
  admin:
    driver: bridge
  vault:
    driver: bridge
